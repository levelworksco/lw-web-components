<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Post Detail — Lit CDN Demo</title>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #f5f5f5;
      font-family: 'Source Sans 3', sans-serif;
      padding: 2rem 1rem;
    }
  </style>
</head>
<body>

  <!--
    ╔══════════════════════════════════════════════════════════════╗
    ║  <post-detail> — single post detail page component          ║
    ║                                                             ║
    ║  ATTRIBUTES → CSS vars (--pd-<name>):                       ║
    ║    container-width, container-max-width, container-margin,   ║
    ║    container-background                                      ║
    ║    title-color, title-font-size, title-font-family          ║
    ║    url-color                                                 ║
    ║    image-border-radius, image-caption-color                 ║
    ║    summary-color                                            ║
    ║    meta-label-color, meta-value-color                       ║
    ║    body-color, body-line-height, body-font-size             ║
    ║    section-label-color, section-label-font-size             ║
    ║    css-vars → freeform "key:val; key:val"                   ║
    ║                                                             ║
    ║  DATA (JS property):                                        ║
    ║    el.post = {                                              ║
    ║      title, url, image, imageCaption,                       ║
    ║      summary,                                               ║
    ║      author, date, postType, categories[],                  ║
    ║      body[]  → array of block objects:                       ║
    ║        { type: 'heading',   text }                           ║
    ║        { type: 'paragraph', text }                           ║
    ║        { type: 'image',     src, alt? }                      ║
    ║    }                                                        ║
    ╚══════════════════════════════════════════════════════════════╝
  -->
  <post-detail
    id="myPost"
    container-width="720px"
  ></post-detail>

  <script type="module">
    import { LitElement, html, css, repeat }
      from 'https://cdn.jsdelivr.net/gh/lit/dist@3/all/lit-all.min.js';

    class PostDetail extends LitElement {

      static properties = {
        post:    { type: Object  },
        loading: { type: Boolean },

        containerWidth:       { attribute: 'container-width'        },
        containerMaxWidth:    { attribute: 'container-max-width'    },
        containerMargin:      { attribute: 'container-margin'       },
        containerBackground:  { attribute: 'container-background'   },
        titleColor:           { attribute: 'title-color'            },
        titleFontSize:        { attribute: 'title-font-size'        },
        titleFontFamily:      { attribute: 'title-font-family'      },
        urlColor:             { attribute: 'url-color'              },
        imageBorderRadius:    { attribute: 'image-border-radius'    },
        imageCaptionColor:    { attribute: 'image-caption-color'    },
        summaryColor:         { attribute: 'summary-color'          },
        metaLabelColor:       { attribute: 'meta-label-color'       },
        metaValueColor:       { attribute: 'meta-value-color'       },
        bodyColor:            { attribute: 'body-color'             },
        bodyLineHeight:       { attribute: 'body-line-height'       },
        bodyFontSize:         { attribute: 'body-font-size'         },
        sectionLabelColor:    { attribute: 'section-label-color'    },
        sectionLabelFontSize: { attribute: 'section-label-font-size'},
        cssVars:              { attribute: 'css-vars'               },
      };

      attributeChangedCallback(name, _old, value) {
        super.attributeChangedCallback?.(name, _old, value);
        const cssAttrs = [
          'container-max-width', 'container-width', 'container-margin', 'container-background',
          'title-color', 'title-font-size', 'title-font-family',
          'url-color',
          'image-border-radius', 'image-caption-color',
          'summary-color',
          'meta-label-color', 'meta-value-color',
          'body-color', 'body-line-height', 'body-font-size',
          'section-label-color', 'section-label-font-size',
        ];
        if (cssAttrs.includes(name)) {
          this.style.setProperty(`--pd-${name}`, value);
        }
        if (name === 'css-vars' && value) {
          value.split(';').forEach(pair => {
            const [k, ...rest] = pair.split(':');
            if (k && rest.length) this.style.setProperty(k.trim(), rest.join(':').trim());
          });
        }
      }

      constructor() {
        super();
        this.post    = null;
        this.loading = false;
      }

      static styles = css`
        :host {
          display: block;
          width: 100%;
          font-family: 'Source Sans 3', sans-serif;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }

        .pd-container {
          width:      var(--pd-container-width, 100%);
          max-width:  var(--pd-container-max-width, 720px);
          margin:     var(--pd-container-margin, 0 auto);
          background: var(--pd-container-background, transparent);
        }

        .pd-loading, .pd-empty {
          padding: 3rem 0; text-align: center; color: #bbb; font-size: 0.9rem;
        }

        /* ── title ── */
        .pd-title {
          font-family: var(--pd-title-font-family, 'Source Sans 3', sans-serif);
          font-size:   var(--pd-title-font-size, 2rem);
          font-weight: 700;
          color:       var(--pd-title-color, #111);
          line-height: 1.2;
          margin-bottom: 0.3rem;
        }

        /* ── canonical url ── */
        .pd-url {
          font-size: 0.72rem;
          color:     var(--pd-url-color, #aaa);
          margin-bottom: 1.25rem;
          word-break: break-all;
        }

        /* ── hero image ── */
        .pd-image-wrap {
          width: 100%;
          border-radius: var(--pd-image-border-radius, 4px);
          overflow: hidden;
          margin-bottom: 0.4rem;
          background: #ddd;
          aspect-ratio: 16/7;
        }
        .pd-image-wrap img { width:100%; height:100%; object-fit:cover; display:block; }

        .pd-image-caption {
          font-size: 0.68rem;
          color:     var(--pd-image-caption-color, #aaa);
          margin-bottom: 1.5rem;
          word-break: break-all;
        }

        /* ── section label ── */
        .pd-section-label {
          font-size:      var(--pd-section-label-font-size, 0.65rem);
          font-weight:    700;
          letter-spacing: 0.12em;
          text-transform: uppercase;
          color:          var(--pd-section-label-color, #aaa);
          margin-bottom:  0.5rem;
        }

        .pd-divider {
          border: none;
          border-top: 1px solid #e8e8e8;
          margin: 1.4rem 0;
        }

        /* ── summary ── */
        .pd-summary {
          font-size: 0.9rem;
          color:     var(--pd-summary-color, #333);
          line-height: 1.7;
        }

        /* ── meta grid ── */
        .pd-meta-grid {
          display: grid;
          grid-template-columns: repeat(4, auto);
          gap: 0 2rem;
          align-items: start;
        }
        @media (max-width: 500px) {
          .pd-meta-grid { grid-template-columns: repeat(2, 1fr); gap: 1rem; }
        }

        .pd-meta-label {
          font-size:      var(--pd-section-label-font-size, 0.65rem);
          font-weight:    700;
          letter-spacing: 0.12em;
          text-transform: uppercase;
          color:          var(--pd-meta-label-color, #aaa);
          margin-bottom:  0.3rem;
        }
        .pd-meta-value {
          font-size: 0.84rem;
          color:     var(--pd-meta-value-color, #222);
          line-height: 1.5;
        }
        .pd-categories { display:flex; flex-direction:column; gap:0.1rem; }
        .pd-category   { font-size:0.84rem; color: var(--pd-meta-value-color, #222); }

        /* ── body ── */
        .pd-body {
          font-size:   var(--pd-body-font-size,   0.9rem);
          color:       var(--pd-body-color,       #222);
          line-height: var(--pd-body-line-height, 1.75);
        }
        .pd-body p         { margin-bottom: 1rem; }
        .pd-body p:last-child { margin-bottom: 0; }
        .pd-body strong    { font-weight: 700; }
        .pd-body .pd-heading {
          font-weight: 700;
          font-size:   1rem;
          margin: 1.4rem 0 0.5rem;
          color: var(--pd-title-color, #111);
        }

        /* inline image inside body */
        .pd-body-image {
          margin: 1.25rem 0;
          width: 100%;
          border-radius: var(--pd-image-border-radius, 4px);
          overflow: hidden;
        }
        .pd-body-image img {
          width: 100%;
          display: block;
          object-fit: cover;
        }
      `;

      _renderBody(body) {
        if (!body || !body.length) return null;
        return repeat(body, (_, i) => i, block => {
          if (block.type === 'heading') {
            return html`<h2 class="pd-heading">${block.text}</h2>`;
          }
          if (block.type === 'image') {
            return html`
              <div class="pd-body-image">
                <img src="${block.src}" alt="${block.alt ?? ''}" loading="lazy" />
              </div>`;
          }
          return html`<p>${block.text}</p>`;
        });
      }

      render() {
        if (this.loading) return html`<div class="pd-loading">Loading post…</div>`;
        if (!this.post)  return html`<div class="pd-empty">No post data.</div>`;

        const {
          title, url, image, imageCaption,
          summary, author, date, postType, categories, body,
        } = this.post;

        return html`
          <div class="pd-container">

            <h1 class="pd-title">${title}</h1>
            ${url ? html`<a class="pd-url" href="${url}" target="_blank" rel="noopener noreferrer">${url}</a>` : ''}

            ${image ? html`
              <div class="pd-image-wrap">
                <img src="${image}" alt="${title}" loading="lazy" />
              </div>
              ${imageCaption ? html`<div class="pd-image-caption">${imageCaption}</div>` : ''}
            ` : ''}

            <hr class="pd-divider" />
            <div class="pd-section-label">Summary</div>
            <div class="pd-summary">${summary}</div>

            <hr class="pd-divider" />
            <div class="pd-meta-grid">
              <div>
                <div class="pd-meta-label">Author</div>
                <div class="pd-meta-value">${author}</div>
              </div>
              <div>
                <div class="pd-meta-label">Date</div>
                <div class="pd-meta-value">${date}</div>
              </div>
              <div>
                <div class="pd-meta-label">Post Type</div>
                <div class="pd-meta-value">${postType}</div>
              </div>
              <div>
                <div class="pd-meta-label">Post Category</div>
                <div class="pd-categories">
                  ${(categories || []).map(c => html`<span class="pd-category">${c}</span>`)}
                </div>
              </div>
            </div>

            <hr class="pd-divider" />
            <div class="pd-section-label">Body</div>
            <div class="pd-body">
              ${this._renderBody(body)}
            </div>

          </div>
        `;
      }
    }

    customElements.define('post-detail', PostDetail);

    // ── Real data fetched from heartbrightlearning.org ───────────
    document.getElementById('myPost').post = {
      title:        'Teaching That Matters',
      url:          'https://heartbrightlearning.org/blogs/all/teaching-that-matters',
      image:        'https://heartbrightlearning.org/cdn/shop/articles/123314_3f572197-d61b-49c8-a3f7-8432b2fa0165.jpg?v=1774084686&width=1500',
      imageCaption: 'https://heartbrightlearning.org/cdn/shop/articles/123314_3f572197-d61b-49c8-a3f7-8432b2fa0165.jpg?v=1774084686&width=1500',
      summary:      'Counsellor experience shows labels, stress, and lost purpose can harm students. Values education and project-based learning help children feel seen, build resilience, and learn with purpose at school.',
      author:       'Jyoti Kumta',
      date:         'March 04, 2026',
      postType:     'Instructional Blogs',
      categories:   [
        'The Human Side of Schooling',
        'Learner-Centered Methodology',
      ],
      body: [
        { type: 'heading',   text: 'Reflections from a Student Counsellor on Values, Purpose, and Project-Based Learning' },
        { type: 'paragraph', text: 'I did not come to the importance of Values Education through curriculum design or pedagogical theory. I came to it sitting across a small table from children who were already carrying labels far heavier than their schoolbags.' },
        { type: 'image',     src: 'https://heartbrightlearning.org/cdn/shop/articles/123314_3f572197-d61b-49c8-a3f7-8432b2fa0165.jpg?v=1774084686&width=1500' },
        { type: 'paragraph', text: 'As a student counsellor in a school, I often met students after the system had reached a conclusion about them. They were sent to me with brief summaries—sometimes no more than a sentence long—that attempted to explain who they were. Rarely did those summaries come close to the truth.' },
        { type: 'paragraph', text: 'One particular instance remains etched in my mind. Three students from Grades 2 and 3 were referred to me with identical descriptions: "the naughtiest and most disruptive child in the class." On paper, they appeared the same problem, requiring the same correction. In reality, their stories could not have been more different.' },
        { type: 'paragraph', text: 'The first child was struggling with dyslexia. He could not follow what was happening in the classroom, and disruption had become his only way to mask confusion and preserve dignity. The second child was highly intelligent and completed his work far ahead of his peers. Bored and unstimulated for most of the period, he sought engagement in whatever form he could find. The third child simply could not read what was written on the blackboard—he had never been taught cursive handwriting, yet the classroom assumed he knew it.' },
        { type: 'paragraph', text: 'None of these children were "naughty." They were unheard.' },
        { type: 'paragraph', text: 'That moment marked a turning point for me. It revealed how quickly behavior is judged without understanding, and how easily children internalize these judgments as identity. More importantly, it exposed a deeper issue: when education focuses narrowly on performance and compliance, it neglects the values of empathy, fairness, and curiosity. And when values are absent, misunderstanding becomes the norm.' },
        { type: 'heading',   text: 'Values Are Not an Add-On. They Are the Foundation.' },
        { type: 'paragraph', text: 'In the counselling room, academic achievement rarely took center stage. What emerged instead were struggles with self-worth, belonging, frustration, and fear—fear of failure, of being misunderstood, of not being "enough."' },
        { type: 'paragraph', text: 'What became clear to me over time was this: values were being assumed, not taught. Students were expected to be resilient without learning how to handle failure, collaborative without learning how to navigate differences, and confident without learning how to understand themselves.' },
        { type: 'paragraph', text: 'Values education is often misunderstood as moral instruction—telling children what is right and wrong. But values are not absorbed through lectures. They are shaped through experience, through how systems respond to difference, and through whether adults choose curiosity over judgment.' },
        { type: 'paragraph', text: 'When the three children labeled "disruptive" were finally understood, something shifted. The problem was no longer them; it was the environment. And that realization stayed with me: behavior is communication, and values determine whether we listen.' },
        { type: 'heading',   text: 'The Quiet Crisis of Purpose in Young Learners' },
        { type: 'paragraph', text: 'As I continued my work as a counsellor, another pattern emerged—one that was less visible but equally concerning. Many students, even those who were academically successful, struggled with a deep sense of disconnection.' },
        { type: 'paragraph', text: 'They followed instructions, completed assignments, and met expectations. Yet beneath the surface was a persistent question: Why am I doing all this?' },
        { type: 'paragraph', text: 'This lack of purpose manifested in different ways—anxiety, apathy, perfectionism, or quiet withdrawal. Without a sense of meaning, effort felt exhausting rather than energizing. Learning became transactional, reduced to marks, rankings, and approval.' },
        { type: 'paragraph', text: 'Purpose, I realized, is not something students are supposed to "figure out later." It begins early, with the experience of being seen, valued, and capable of contributing. Purpose grows when learners feel their strengths matter and their differences are not deficits.' },
        { type: 'heading',   text: 'From Intervention to Prevention' },
        { type: 'paragraph', text: 'Over time, I saw that many of the challenges I was addressing reactively in the counselling room could be addressed proactively in the classroom. If students were misunderstood, disengaged, or disconnected, it was often because the learning environment left little room for individuality, agency, or meaning.' },
        { type: 'paragraph', text: 'I began to ask a different question: What kind of learning experiences naturally cultivate values and purpose, rather than attempting to repair their absence later? This question led me to Project-Based Learning (PBL).' },
        { type: 'heading',   text: 'How Project-Based Learning Creates Space for Values' },
        { type: 'paragraph', text: 'I first encountered PBL not as a formal classroom strategy, but as an out-of-school learning experience. What struck me immediately was not the academic output, but the transformation in relationships.' },
        { type: 'paragraph', text: "I observed children who initially struggled to get along—children who clashed, avoided each other, or competed for dominance—slowly begin to collaborate. Over the course of the project, they learned to negotiate roles, rely on each other's strengths, and work through disagreements. By the end, not only had they completed the project, but they had formed bonds that endured long after. Even five years later, many of those children remain close friends." },
        { type: 'paragraph', text: 'This experience reinforced something I deeply believe: values emerge most powerfully when children are given shared purpose and real responsibility. In PBL environments, values such as empathy, respect, accountability, and perseverance are not taught as concepts—they are practiced daily.' },
        { type: 'heading',   text: 'The Balance of Freedom and Structure' },
        { type: 'paragraph', text: 'However, I also learned that PBL is not simply about giving students freedom. Without thoughtful design, freedom can quickly become chaos or exclusion. What makes PBL effective is the careful balance between freedom and structure. Students need autonomy, but they also need scaffolding.' },
        { type: 'paragraph', text: 'In successful PBL environments, educators learn to involve every student based on their strengths—not just those who are outspoken or academically confident. The quiet thinker, the hands-on builder, the natural organizer, the storyteller—all have a place.' },
        { type: 'heading',   text: 'Purpose as a Source of Resilience' },
        { type: 'paragraph', text: 'One of the most striking insights from my counselling work was this: students who had even a fragile sense of purpose coped better with hardships. Purpose acted as an anchor. It allowed students to view setbacks as part of growth rather than evidence of failure.' },
        { type: 'paragraph', text: 'PBL supports this by shifting the focus from perfection to progress. Mistakes are not endpoints; they are data. Reflection becomes as important as results. Students learn that learning itself is a process—messy, iterative, and deeply human.' },
        { type: 'heading',   text: 'Redefining Success in Education' },
        { type: 'paragraph', text: 'My experiences as a student counsellor fundamentally changed how I define success in education. True success lies in helping learners develop an inner compass—one guided by values, oriented by purpose, and strengthened through meaningful experience.' },
        { type: 'paragraph', text: 'When education neglects these elements, counselling rooms fill with students carrying unspoken distress. When education embraces them, those conversations change. They move from crisis management to exploration, from repair to growth.' },
        { type: 'heading',   text: 'Education as Preventive Care' },
        { type: 'paragraph', text: 'In healthcare, prevention is more powerful than intervention. The same principle applies to education. Teaching values, nurturing purpose, and adopting methodologies like Project-Based Learning is not an enrichment initiative. It is preventive care for emotional, social, and ethical wellbeing.' },
        { type: 'paragraph', text: 'As a student counsellor, I have seen what happens when these foundations are missing. As an educator and advocate for purposeful learning, I have also seen what becomes possible when they are present.' },
        { type: 'paragraph', text: 'The choice before us is not whether we have time to teach values and purpose—but whether we can afford the cost of ignoring them. Because when education teaches what truly matters, fewer children need to be "fixed." Instead, they are finally understood.' },
      ],
    };
  </script>

</body>
</html>
