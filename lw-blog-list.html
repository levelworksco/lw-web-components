<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Post List — Lit CDN Demo</title>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #f0ede8;
      font-family: 'Source Sans 3', sans-serif;
      padding: 2rem 1rem;
    }
  </style>
</head>
<body>

  <post-list
    id="myList"
    container-width="720px"
  ></post-list>

  <script type="module">
    import { LitElement, html, css }
      from 'https://cdn.jsdelivr.net/gh/lit/dist@3/core/lit-core.min.js';

    // ─────────────────────────────────────────────────────────────
    // COMPONENT: <post-item>
    // Internal child — renders one post in list OR grid mode.
    // view prop is passed down from post-list.
    // ─────────────────────────────────────────────────────────────
    class PostItem extends LitElement {

      static properties = {
        post: { type: Object },
        view: { type: String }, // 'list' | 'grid'
      };

      static styles = css`
        :host { display: block; animation: fadeUp 0.25s ease both; }

        @keyframes fadeUp {
          from { opacity: 0; transform: translateY(6px); }
          to   { opacity: 1; transform: translateY(0); }
        }

        /* ══════════════════════════════
           LIST VIEW
        ══════════════════════════════ */
        .list-row {
          display: flex;
          gap: 1rem;
          align-items: flex-start;
          padding: var(--pl-card-padding, 1.1rem 0);
          border-bottom: 1px solid var(--pl-card-divider, #e5e5e5);
        }
        :host(:last-child) .list-row { border-bottom: none; }

        .list-content { flex: 1; min-width: 0; }

        .list-title {
          font-size:   var(--pl-title-font-size,   1rem);
          font-weight: var(--pl-title-font-weight, 700);
          color:       var(--pl-title-color,       #111);
          line-height: 1.3;
          margin-bottom: 0.35rem;
          cursor: pointer;
          transition: color 0.15s;
          font-family: var(--pl-title-font-family, 'Source Sans 3', sans-serif);
        }
        .list-title:hover { color: var(--pl-title-hover-color, #555); }

        .list-excerpt {
          font-size:   var(--pl-excerpt-font-size, 0.84rem);
          color:       var(--pl-excerpt-color,     #444);
          line-height: 1.65;
          margin-bottom: 0.5rem;
          display: -webkit-box;
          -webkit-line-clamp: 3;
          -webkit-box-orient: vertical;
          overflow: hidden;
        }

        .list-meta {
          display: flex;
          align-items: center;
          gap: 0.3rem;
          flex-wrap: wrap;
          font-size: var(--pl-meta-font-size, 0.72rem);
          color:     var(--pl-meta-color,     #999);
        }

        .list-image {
          width:         var(--pl-image-width,  130px);
          height:        var(--pl-image-height, 90px);
          flex-shrink:   0;
          border-radius: var(--pl-image-border-radius, 4px);
          overflow:      hidden;
          background:    #ddd;
        }
        .list-image img { width:100%; height:100%; object-fit:cover; display:block; }

        /* ══════════════════════════════
           GRID VIEW
        ══════════════════════════════ */
        .grid-card {
          display: flex;
          flex-direction: column;
          background: #fff;
          border-radius: var(--pl-grid-card-radius, 6px);
          overflow: hidden;
          height: 100%;
        }

        .grid-image {
          width: 100%;
          aspect-ratio: 16/10;
          overflow: hidden;
          background: #ddd;
          flex-shrink: 0;
        }
        .grid-image img { width:100%; height:100%; object-fit:cover; display:block; }

        .grid-body {
          padding: 0.85rem 0.85rem 0.75rem;
          display: flex;
          flex-direction: column;
          flex: 1;
        }

        .grid-title {
          font-size:   var(--pl-title-font-size,   0.95rem);
          font-weight: var(--pl-title-font-weight, 700);
          color:       var(--pl-title-color,       #111);
          line-height: 1.3;
          margin-bottom: 0.35rem;
          cursor: pointer;
          transition: color 0.15s;
          font-family: var(--pl-title-font-family, 'Source Sans 3', sans-serif);
        }
        .grid-title:hover { color: var(--pl-title-hover-color, #555); }

        .grid-excerpt {
          font-size:   var(--pl-excerpt-font-size, 0.8rem);
          color:       var(--pl-excerpt-color,     #555);
          line-height: 1.6;
          margin-bottom: 0.6rem;
          display: -webkit-box;
          -webkit-line-clamp: 4;
          -webkit-box-orient: vertical;
          overflow: hidden;
          flex: 1;
        }

        .grid-meta {
          display: flex;
          align-items: center;
          gap: 0.3rem;
          flex-wrap: wrap;
          font-size: var(--pl-meta-font-size, 0.68rem);
          color:     var(--pl-meta-color,     #999);
          margin-top: auto;
        }

        /* shared meta pieces */
        .meta-author   { color: var(--pl-author-color,   #999); font-weight: 400; }
        .meta-dot      { color: #ccc; }
        .meta-category { color: var(--pl-category-color, #999); font-weight: 400; }

        .image-placeholder {
          width:100%; height:100%; background:#e8e4df;
          display:flex; align-items:center; justify-content:center; font-size:1.5rem;
        }

        @media (max-width: 480px) {
          .list-image { width:80px; height:60px; }
        }
      `;

      constructor() { super(); this.post = {}; this.view = 'list'; }

      _meta(author, date, category) {
        return html`
          <span class="meta-author">${author}</span>
          <span class="meta-dot">•</span>
          <span>${date}</span>
          <span class="meta-dot">•</span>
          <span class="meta-category">${category}</span>
        `;
      }

      render() {
        const { title, excerpt, author, date, category, image } = this.post;
        const img = image
          ? html`<img src="${image}" alt="${title}" />`
          : html`<div class="image-placeholder">📖</div>`;

        if (this.view === 'grid') {
          return html`
            <div class="grid-card">
              <div class="grid-image">${img}</div>
              <div class="grid-body">
                <div class="grid-title">${title}</div>
                <div class="grid-excerpt">${excerpt}</div>
                <div class="grid-meta">${this._meta(author, date, category)}</div>
              </div>
            </div>
          `;
        }

        // default: list
        return html`
          <div class="list-row">
            <div class="list-content">
              <div class="list-title">${title}</div>
              <div class="list-excerpt">${excerpt}</div>
              <div class="list-meta">${this._meta(author, date, category)}</div>
            </div>
            <div class="list-image">${img}</div>
          </div>
        `;
      }
    }

    customElements.define('post-item', PostItem);


    // ─────────────────────────────────────────────────────────────
    // COMPONENT: <post-list>
    // Single tag the user places. Supports list/grid toggle.
    //
    // ATTRIBUTES → CSS vars (--pl-<name>):
    //   container-max-width, container-padding, container-background
    //   container-border-radius, container-box-shadow
    //   card-padding, card-divider, grid-card-radius, grid-columns
    //   title-color, title-font-size, title-font-weight,
    //   title-font-family, title-hover-color
    //   excerpt-color, excerpt-font-size
    //   meta-color, meta-font-size, author-color, category-color
    //   image-width, image-height, image-border-radius
    //   header-border-color, header-font-size
    //   toggle-active-color, toggle-inactive-color
    //   css-vars  →  freeform "key:val; key:val"
    //
    // DATA:
    //   posts      (JS property) — array of post objects
    //   loading    (attribute)   — show loading state
    //   list-label (attribute)   — header text
    //   default-view (attribute) — 'list' | 'grid'
    // ─────────────────────────────────────────────────────────────
    class PostList extends LitElement {

      static properties = {
        posts:       { type: Array   },
        loading:     { type: Boolean },
        listLabel:   { attribute: 'list-label'    },
        defaultView: { attribute: 'default-view'  },

        // internal state
        _view: { state: true },

        // container
        containerWidth:        { attribute: 'container-width'         },
        containerMaxWidth:     { attribute: 'container-max-width'     },
        containerPadding:      { attribute: 'container-padding'       },
        containerBackground:   { attribute: 'container-background'    },
        containerBorderRadius: { attribute: 'container-border-radius' },
        containerBoxShadow:    { attribute: 'container-box-shadow'    },
        // card
        cardPadding:    { attribute: 'card-padding'    },
        cardDivider:    { attribute: 'card-divider'    },
        gridCardRadius: { attribute: 'grid-card-radius'},
        gridColumns:    { attribute: 'grid-columns'    },
        // title
        titleColor:      { attribute: 'title-color'       },
        titleFontSize:   { attribute: 'title-font-size'   },
        titleFontWeight: { attribute: 'title-font-weight' },
        titleFontFamily: { attribute: 'title-font-family' },
        titleHoverColor: { attribute: 'title-hover-color' },
        // excerpt
        excerptColor:    { attribute: 'excerpt-color'     },
        excerptFontSize: { attribute: 'excerpt-font-size' },
        // meta
        metaColor:     { attribute: 'meta-color'     },
        metaFontSize:  { attribute: 'meta-font-size' },
        authorColor:   { attribute: 'author-color'   },
        categoryColor: { attribute: 'category-color' },
        // image
        imageWidth:        { attribute: 'image-width'         },
        imageHeight:       { attribute: 'image-height'        },
        imageBorderRadius: { attribute: 'image-border-radius' },
        // header
        headerBorderColor:  { attribute: 'header-border-color'  },
        headerFontSize:     { attribute: 'header-font-size'     },
        // toggle
        toggleActiveColor:   { attribute: 'toggle-active-color'   },
        toggleInactiveColor: { attribute: 'toggle-inactive-color' },
        // freeform
        cssVars: { attribute: 'css-vars' },
      };

      attributeChangedCallback(name, _old, value) {
        super.attributeChangedCallback?.(name, _old, value);

        if (name === 'default-view') {
          this._view = value === 'grid' ? 'grid' : 'list';
        }

        const cssAttrs = [
          'container-width', 'container-max-width', 'container-padding', 'container-background',
          'container-border-radius', 'container-box-shadow',
          'card-padding', 'card-divider', 'grid-card-radius', 'grid-columns',
          'title-color', 'title-font-size', 'title-font-weight',
          'title-font-family', 'title-hover-color',
          'excerpt-color', 'excerpt-font-size',
          'meta-color', 'meta-font-size', 'author-color', 'category-color',
          'image-width', 'image-height', 'image-border-radius',
          'header-border-color', 'header-font-size',
          'toggle-active-color', 'toggle-inactive-color',
        ];

        if (cssAttrs.includes(name)) {
          this.style.setProperty(`--pl-${name}`, value);
        }

        if (name === 'css-vars' && value) {
          value.split(';').forEach(pair => {
            const [k, ...rest] = pair.split(':');
            if (k && rest.length) {
              this.style.setProperty(k.trim(), rest.join(':').trim());
            }
          });
        }
      }

      constructor() {
        super();
        this.posts       = [];
        this.loading     = false;
        this.listLabel   = 'Latest Posts';
        this.defaultView = 'list';
        this._view       = 'list';
      }

      _setView(v) { this._view = v; }

      // ── icon SVGs ──────────────────────────────────────────────
      _listIcon(active) {
        const color = active
          ? 'var(--pl-toggle-active-color, #f58220)'
          : 'var(--pl-toggle-inactive-color, #bbb)';
        return html`
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" style="display:block">
            <rect x="1" y="2"  width="16" height="3" rx="1" fill="${color}"/>
            <rect x="1" y="7"  width="16" height="3" rx="1" fill="${color}"/>
            <rect x="1" y="12" width="16" height="3" rx="1" fill="${color}"/>
          </svg>`;
      }

      _gridIcon(active) {
        const color = active
          ? 'var(--pl-toggle-active-color, #f58220)'
          : 'var(--pl-toggle-inactive-color, #bbb)';
        return html`
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" style="display:block">
            <rect x="1"  y="1"  width="7" height="7" rx="1.5" fill="${color}"/>
            <rect x="10" y="1"  width="7" height="7" rx="1.5" fill="${color}"/>
            <rect x="1"  y="10" width="7" height="7" rx="1.5" fill="${color}"/>
            <rect x="10" y="10" width="7" height="7" rx="1.5" fill="${color}"/>
          </svg>`;
      }

      static styles = css`
        :host {
          display: block;
          width: 100%;
          font-family: 'Source Sans 3', sans-serif;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }

        .pl-container {
          width:         100%;
          max-width:     var(--pl-container-width, 720px);
          margin:        0 auto;
          padding:       var(--pl-container-padding, 0 1.5rem);
          background:    var(--pl-container-background, #ffffff);
          border-radius: var(--pl-container-border-radius, 6px);
          box-shadow:    var(--pl-container-box-shadow, 0 1px 8px rgba(0,0,0,0.07));
        }

        /* header row: label left, toggle icons right */
        .pl-header {
          display: flex;
          align-items: center;
          justify-content: space-between;
          padding: 1.1rem 0 0.6rem;
          border-bottom: 1px solid var(--pl-header-border-color, #e0e0e0);
        }

        .pl-header h2 {
          font-family:    'Source Sans 3', sans-serif;
          font-size:      var(--pl-header-font-size, 0.72rem);
          font-weight:    700;
          letter-spacing: 0.1em;
          text-transform: uppercase;
          color: #222;
          margin: 0;
        }

        /* toggle buttons */
        .pl-toggle {
          display: flex;
          align-items: center;
          gap: 0.4rem;
        }

        .pl-toggle button {
          background: none;
          border: none;
          padding: 4px;
          cursor: pointer;
          display: flex;
          align-items: center;
          justify-content: center;
          border-radius: 4px;
          transition: background 0.15s;
          line-height: 0;
        }
        .pl-toggle button:hover { background: #f5f5f5; }

        /* list mode: items stacked */
        .pl-list { display: block; }

        /* grid mode: 3-column grid */
        .pl-grid {
          display: grid;
          grid-template-columns: repeat(var(--pl-grid-columns, 3), 1fr);
          gap: 1rem;
          padding: 1rem 0;
        }

        @media (max-width: 600px) {
          .pl-grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 380px) {
          .pl-grid { grid-template-columns: 1fr; }
        }

        .pl-loading,
        .pl-empty {
          padding: 2.5rem 0;
          text-align: center;
          color: #bbb;
          font-size: 0.85rem;
        }

        .pl-footer {
          padding: 1rem 0;
          text-align: center;
          font-size: 0.75rem;
          color: #bbb;
          border-top: 1px solid #f0f0f0;
        }
      `;

      render() {
        const isGrid = this._view === 'grid';

        const items = this.loading
          ? html`<div class="pl-loading">Loading posts…</div>`
          : this.posts.length === 0
            ? html`<div class="pl-empty">No posts found.</div>`
            : this.posts.map((post, i) => html`
                <post-item
                  .post=${post}
                  .view=${this._view}
                  style="animation-delay:${i * 60}ms"
                ></post-item>
              `);

        return html`
          <div class="pl-container">

            <div class="pl-header">
              <h2>${this.listLabel}</h2>
              <div class="pl-toggle">
                <button
                  aria-label="List view"
                  title="List view"
                  @click=${() => this._setView('list')}
                >
                  ${this._listIcon(!isGrid)}
                </button>
                <button
                  aria-label="Grid view"
                  title="Grid view"
                  @click=${() => this._setView('grid')}
                >
                  ${this._gridIcon(isGrid)}
                </button>
              </div>
            </div>

            <div class=${isGrid ? 'pl-grid' : 'pl-list'}>
              ${items}
            </div>

            <div class="pl-footer">
              Showing all ${this.posts.length} posts
            </div>

          </div>
        `;
      }
    }

    customElements.define('post-list', PostList);

    // ── Pass data ────────────────────────────────────────────────
    document.getElementById('myList').posts = [
