<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blog</title>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #ffffff;
      font-family: 'Source Sans 3', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      max-width: 960px;
      margin: 0 auto;
      padding: 0 2rem 4rem;
    }

    lw-insights-bar {
      position: sticky;
      top: 0;
      z-index: 200;
    }

    lw-blog-search {
      display: block;
      position: sticky;
      top: 40px;
      z-index: 100;
      background: #fff;
      padding: 1rem 0 0.5rem;
      box-shadow: 0 6px 12px -2px rgba(255,255,255,1), 0 10px 16px -4px rgba(255,255,255,0.9);
    }

    lw-blog-list {
      position: relative;
      z-index: 0;
    }
  </style>
</head>
<body>

  <lw-insights-bar id="insights"></lw-insights-bar>
  <lw-header></lw-header>

  <div class="page">
    <lw-blog-search id="search" slider-max="1" slider-step="0.1"></lw-blog-search>
    <lw-blog-list   id="list" style="--pl-sidebar-top: 155px"></lw-blog-list>
  </div>

  <script type="module">
    import './lw-header/lw-header.js';
    import './lw-insights-bar/lw-insights-bar.js';
    import './lw-blog-search/lw-blog-search.js';
    import './lw-blog-list/lw-blog-list.js';

    const search = document.getElementById('search');
    const list   = document.getElementById('list');

    // Search → list
    search.addEventListener('search-change', e => { list.searchQuery   = e.detail.value; });
    search.addEventListener('slider-change', e => { list.semanticRatio = e.detail.value; });

    // List → search (processing time)
    list.addEventListener('search-time-update', e => { search.searchTime = e.detail.ms; });

    // Categories (static until categories API is wired)
    list.categories = [
      { value: 'all',                    label: 'All'                        },
      { value: 'Learning',               label: 'Learning'                   },
      { value: 'Reading & Literacy',     label: 'Reading & Literacy'         },
      { value: 'Learning Activities',    label: 'Learning Activities'        },
      { value: 'Project-Based Learning', label: 'Project-Based Learning'     },
      { value: 'Child Growth',           label: 'Child Growth & Development' },
      { value: 'Parenting',              label: 'Parenting'                  },
      { value: 'Creative Learning',      label: 'Creative Learning'          },
      { value: 'Learning Strategies',    label: 'Learning Strategies'        },
      { value: 'STEM Learning',          label: 'STEM Learning'              },
      { value: 'Tips & Tricks',          label: 'Tips & Tricks'              },
      { value: 'Instructional Blogs',    label: 'Activities & Worksheets'    },
    ];
  </script>

</body>
</html>
